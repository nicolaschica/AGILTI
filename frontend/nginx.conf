server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback a index.html para que React Router resuelva las rutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
