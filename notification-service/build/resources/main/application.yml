server:
  port: 8081

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: agilti
    password: agilti_pass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.agilti.notificationservice.messaging"
        spring.json.value.default.type: com.agilti.notificationservice.messaging.TicketCreadoEvent
    listener:
      ack-mode: RECORD

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

agilti:
  kafka:
    topic-ticket-creado: ticket-creado